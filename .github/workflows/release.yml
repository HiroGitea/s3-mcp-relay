name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binaries
        shell: bash
        env:
          RELAY_UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: cargo build --release --workspace --target "${{ matrix.target }}"
      - name: Stage assets
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/relay-agent${{ matrix.ext }}" "relay-agent-${{ matrix.label }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/s3-relay-mcp${{ matrix.ext }}" "s3-relay-mcp-${{ matrix.label }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.label }}
          path: |
            relay-agent-${{ matrix.label }}${{ matrix.ext }}
            s3-relay-mcp-${{ matrix.label }}${{ matrix.ext }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            relay-agent-*
            s3-relay-mcp-*
